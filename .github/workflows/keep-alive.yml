name: Keep Render Server Alive

on:
  schedule:
    # 5 overlapping schedules — fires at minute 0, 2, 4, 6, 8 of every 10-min window
    # GitHub Actions may delay cron by up to 10 min, so overlapping ensures coverage
    - cron: '0,10,20,30,40,50 * * * *'   # every 10 minutes at :00
    - cron: '2,12,22,32,42,52 * * * *'   # every 10 minutes at :02
    - cron: '4,14,24,34,44,54 * * * *'   # every 10 minutes at :04
    - cron: '6,16,26,36,46,56 * * * *'   # every 10 minutes at :06
    - cron: '8,18,28,38,48,58 * * * *'   # every 10 minutes at :08
  workflow_dispatch:

jobs:
  ping:
    name: Ping Server
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Wake up server
        continue-on-error: true
        run: |
          SERVER="https://jangal-sammilani-adarsha-high-school-and.onrender.com"
          echo "⏰ $(date -u '+%H:%M:%S UTC') — pinging $SERVER"

          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 "$SERVER/api/health" || echo "000")
            echo "  attempt $i → $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✅ Server alive!"
              break
            fi
            [ $i -lt 5 ] && sleep 12
          done

      - name: Keep DB warm
        continue-on-error: true
        run: |
          SERVER="https://jangal-sammilani-adarsha-high-school-and.onrender.com"
          for endpoint in /api/keep-alive /api/public-home /api/auth/check; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$SERVER$endpoint" || echo "000")
            echo "  $endpoint → $STATUS"
          done
          echo "✅ Done at $(date -u '+%H:%M:%S UTC')"
