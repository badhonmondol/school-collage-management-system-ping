name: Keep Render Server Alive

on:
  schedule:
    # Multiple offsets to beat GitHub Actions cron delay
    - cron: '0,14,28,42,56 * * * *'
    - cron: '7,21,35,49 * * * *'
  workflow_dispatch:
  # Re-trigger itself after each run (chain reaction)
  workflow_run:
    workflows: ["Keep Render Server Alive"]
    types: [completed]

jobs:
  ping:
    name: Ping Server
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Wake up Render server
        continue-on-error: true
        run: |
          SERVER="https://jangal-sammilani-adarsha-high-school-and.onrender.com"
          echo "⏰ $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          for i in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$SERVER/api/health" || echo "000")
            echo "  attempt $i → /api/health → $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✅ Server alive!"
              break
            fi
            [ $i -lt 3 ] && sleep 10
          done

          # Additional endpoints to keep DB warm
          for ep in /api/keep-alive /api/public-home; do
            S=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$SERVER$ep" || echo "000")
            echo "  $ep → $S"
          done

          echo "✅ Done at $(date -u '+%H:%M:%S UTC')"
