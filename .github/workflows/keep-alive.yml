name: Keep Render Server Alive

on:
  schedule:
    # Runs every 6 minutes to keep server alive
    # This ensures server never sleeps (15 min timeout)
    - cron: '*/6 * * * *'
  
  # Manual trigger option (run anytime from Actions tab)
  workflow_dispatch:

jobs:
  ping-server:
    name: Keep Server Awake
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Ping Health Endpoint
        continue-on-error: true
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🚀 Starting server ping at $(date)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          # Server health check with aggressive retry
          SUCCESS=false
          for i in {1..5}; do
            echo ""
            echo "🔄 Attempt $i/5: Pinging /api/health..."
            
            response=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
              https://jangal-sammilani-adarsha-high-school-and.onrender.com/api/health || echo "000")
            
            if [ "$response" = "200" ]; then
              echo "✅ SUCCESS! Server is ALIVE (Status: $response)"
              
              # Show health details
              health_data=$(curl -s --max-time 30 \
                https://jangal-sammilani-adarsha-high-school-and.onrender.com/api/health)
              echo "📊 Health Info: $health_data"
              
              SUCCESS=true
              break
            else
              echo "⚠️  Server responded with status: $response"
              if [ $i -lt 5 ]; then
                echo "   ⏳ Waiting 15 seconds before retry..."
                sleep 15
              fi
            fi
          done
          
          if [ "$SUCCESS" = false ]; then
            echo ""
            echo "⚠️  WARNING: Server may be sleeping or down!"
          fi
      
      - name: Quick Keep-Alive Ping
        continue-on-error: true
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "⚡ Quick keep-alive ping..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          keepalive_response=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
            https://jangal-sammilani-adarsha-high-school-and.onrender.com/api/keep-alive || echo "000")
          
          if [ "$keepalive_response" = "200" ]; then
            echo "✅ Keep-alive successful (Status: $keepalive_response)"
          else
            echo "⚠️  Keep-alive status: $keepalive_response"
          fi
      
      - name: Ping Public Home
        continue-on-error: true
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🏠 Checking public home endpoint..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          # Public home check with retry
          for i in {1..3}; do
            echo ""
            echo "🔄 Attempt $i/3: Pinging /api/public-home..."
            
            home_response=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
              https://jangal-sammilani-adarsha-high-school-and.onrender.com/api/public-home || echo "000")
            
            if [ "$home_response" = "200" ]; then
              echo "✅ SUCCESS! Public home is accessible (Status: $home_response)"
              break
            else
              echo "⚠️  Public home status: $home_response"
              if [ $i -lt 3 ]; then
                echo "   ⏳ Waiting 10 seconds before retry..."
                sleep 10
              fi
            fi
          done
      
      - name: Ping Database Connection
        continue-on-error: true
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🗄️  Checking database connection..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          # Database connection check with retry
          for i in {1..3}; do
            echo ""
            echo "🔄 Attempt $i/3: Pinging /api/auth/check..."
            
            db_response=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
              https://jangal-sammilani-adarsha-high-school-and.onrender.com/api/auth/check || echo "000")
            
            if [ "$db_response" = "200" ] || [ "$db_response" = "401" ]; then
              echo "✅ SUCCESS! Database is responding (Status: $db_response)"
              break
            else
              echo "⚠️  Database status: $db_response"
              if [ $i -lt 3 ]; then
                echo "   ⏳ Waiting 10 seconds before retry..."
                sleep 10
              fi
            fi
          done
      
      - name: Final Summary
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✨ Keep-alive ping completed!"
          echo "📅 Time: $(date)"
          echo "🔄 Next ping: ~6 minutes"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
