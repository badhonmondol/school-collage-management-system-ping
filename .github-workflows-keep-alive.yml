name: Keep Server Alive

on:
  schedule:
    # প্রতি 5 মিনিটে server ping
    - cron: '*/5 * * * *'
  
  # Manual trigger করার option
  workflow_dispatch:

jobs:
  ping-server:
    name: Ping Render Server
    runs-on: ubuntu-latest
    
    steps:
      - name: Ping Health Endpoint
        continue-on-error: true
        run: |
          echo "🚀 Pinging server at $(date)"
          
          # Server health check with retry logic
          for i in {1..3}; do
            response=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
              https://jangal-sammilani-adarsha-high-school-and.onrender.com/api/health || echo "000")
            
            if [ "$response" = "200" ]; then
              echo "✅ Server is alive (Status: $response)"
              break
            else
              echo "⚠️  Attempt $i: Server responded with status: $response"
              if [ $i -lt 3 ]; then
                echo "   Retrying in 10 seconds..."
                sleep 10
              fi
            fi
          done
      
      - name: Ping Public Home
        continue-on-error: true
        run: |
          echo "🏠 Checking public home..."
          
          # Public home check with retry
          for i in {1..3}; do
            home_response=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
              https://jangal-sammilani-adarsha-high-school-and.onrender.com/api/public-home || echo "000")
            
            if [ "$home_response" = "200" ]; then
              echo "✅ Public home is accessible (Status: $home_response)"
              break
            else
              echo "⚠️  Attempt $i: Public home responded with status: $home_response"
              if [ $i -lt 3 ]; then
                echo "   Retrying in 10 seconds..."
                sleep 10
              fi
            fi
          done
      
      - name: Summary
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✨ Server ping completed at $(date)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
